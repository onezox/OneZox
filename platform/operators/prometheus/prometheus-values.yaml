# Prometheus — Helm values for local Phase-00 development.
# Chart: prometheus-community/prometheus, version 29.19.0 (server v3.13.1).
#
# Standalone chart, not kube-prometheus-stack: disabling alertmanager,
# kube-state-metrics, node-exporter, and pushgateway, none of which Phase-00
# calls for (no alerting, no cluster-node monitoring this phase). Keeps the
# footprint scoped to exactly what Part L asks for — a metrics backend the
# OTel Collector can feed and Grafana can query.

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  persistentVolume:
    enabled: true
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Scrapes the OTel Collector's `prometheus` exporter (Step 20,
# platform/operators/otel/values.yaml) — the pull side of the push/pull
# handoff: Collector exposes /metrics, Prometheus scrapes it here.
#
# Also scrapes the remaining Phase-00 stub service directly (Deployment
# Step 7) — exposes its own /metrics with a *_boot_total counter,
# independent of whatever it emits via OTel — plus edge-gateway's own
# /metrics (Phase-01 Step J2: request count, latency histogram, in-flight
# gauge), added once it actually existed, matching how this same list
# only grew to include each stub once it existed (Phase-00 Problem #17).
#
# provider-stub's target was removed in Phase-02 Step K3 (cutover to
# provider-gateway). provider-gateway's own /metrics HTTP handler existed
# from Step C1 (promhttp.Handler()), but had nothing but Go runtime
# defaults registered until Step N2 added the three provider-gateway-
# specific series (adapter call duration, breaker state, quota headroom)
# — correcting this comment's earlier claim that the endpoint itself was
# "absent"; it existed, just with nothing meaningful to scrape. Added to
# the target list below now that there's something worth scraping, same
# timing precedent edge-gateway followed in Phase-01 (Step J2).
extraScrapeConfigs: |
  - job_name: 'otel-collector'
    scrape_interval: 15s
    static_configs:
      - targets: ['otel-collector-opentelemetry-collector.default.svc.cluster.local:8889']
  - job_name: 'onezox-stubs'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'dataplane-stub.default.svc.cluster.local:8080'
          - 'edge-gateway.default.svc.cluster.local:8080'
          - 'provider-gateway.default.svc.cluster.local:8080'
