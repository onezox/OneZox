# Argo CD Application ADOPTING the existing "tempo" Helm release
# (grafana/tempo @1.24.4) — see operator-prometheus.yaml for the full
# rationale (same Phase-05 Step-N-drift-driven GitOps gap, same
# multi-source adoption pattern).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operator-tempo
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.24.4
      helm:
        releaseName: tempo
        valueFiles:
          - $values/platform/operators/tempo/tempo-values.yaml
    - repoURL: https://github.com/onezox/OneZox.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
