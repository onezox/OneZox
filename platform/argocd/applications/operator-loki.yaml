# Argo CD Application ADOPTING the existing "loki" Helm release
# (grafana/loki @7.1.0) — see operator-prometheus.yaml for the full
# rationale (same Phase-05 Step-N-drift-driven GitOps gap, same
# multi-source adoption pattern).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operator-loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.1.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/platform/operators/loki/loki-values.yaml
    - repoURL: https://github.com/onezox/OneZox.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
