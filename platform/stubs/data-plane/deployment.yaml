# Phase-03 Step B: the real data plane (Python), replacing the Phase-00/01
# dataplane-stub. PRELIMINARY deployment — no cutover yet (that's Step J,
# same mesh-identity-safe sequencing Phase-01 Step F2 and Phase-02 Step K3
# both used: the new service's own mTLS policy goes in and is confirmed
# healthy BEFORE the old one's policy/Deployment are removed). Deployed
# alongside dataplane-stub, different Service names, no conflict — same
# "brought forward early because host-only testing can't reliably reach
# Redis Cluster's multi-shard topology" reasoning provider-gateway's own
# preliminary deployment used in Phase-02 (Step E2 prep).
#
# No CiliumNetworkPolicy yet, deliberately — egress allow-list and mTLS
# both arrive as their own later, dedicated steps, matching exactly how
# provider-gateway's preliminary deployment (Phase-02) had neither until
# Steps J1/K3.
#
# Image tag is the git commit short-SHA this image was built from
# (content-addressed, not a static "phase03" string) — the convention
# established in Phase-02 specifically to avoid Phase-01's same-tag-no-diff
# manual-rollout-restart gap.
#
# Phase-04 Step Q: STATIC_MODEL_REF is gone — replaced by
# model_registry.Cache, an etcd-fed cache with its own INDEPENDENT Vault
# Transit signature verification (never trusts a manifest just because it
# came from etcd). Dedicated ServiceAccount added (data-plane had none
# before — ran under the implicit "default" SA) because Vault's
# Kubernetes auth role (scripts/vault-setup-data-plane.sh) binds
# specifically to it; the same "cluster vouches for this identity, not a
# shared SA" reasoning control-plane's own ServiceAccount already
# established in Step E.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-plane
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-plane
  namespace: default
  labels:
    app: data-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-plane
  template:
    metadata:
      labels:
        app: data-plane
    spec:
      serviceAccountName: data-plane
      containers:
        - name: data-plane
          image: onezox/data-plane:94c6ab1
          imagePullPolicy: IfNotPresent
          env:
            # DEFAULT_MODEL_REF: what request.model falls back to when a
            # caller leaves it empty — "fake" so cluster-side testing
            # still points at provider-fake by default, same purpose
            # STATIC_MODEL_REF's own env-var default used to serve. Now a
            # model_ref the registry resolves, not a literal worker_ref —
            # requires a "fake" manifest actually registered (Step Q's own
            # live verification does this).
            - name: DEFAULT_MODEL_REF
              value: "fake"
            - name: ETCD_ENDPOINT
              value: "etcd.default.svc.cluster.local:2379"
            - name: VAULT_ADDR
              value: "http://vault-active.default.svc.cluster.local:8200"
            - name: VAULT_K8S_ROLE
              value: "data-plane"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50051
              name: grpc
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: data-plane
  namespace: default
  labels:
    app: data-plane
spec:
  selector:
    app: data-plane
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
