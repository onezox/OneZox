# Phase-04 Steps D-J: skeleton (D) -> registry RPCs (E) ->
# IssueProviderToken (J, Vault-backed, short-lived scoped tokens). All
# four ControlService RPCs now have real handlers.
#
# 2 replicas, not provider-gateway's 3: this is Phase-04.txt's own "off
# the hot path" service, a plain config/registry gRPC+HTTP server with no
# streaming/backpressure/coalescing to size for.
#
# Image tag is the git commit short-SHA this Deployment was built at
# (content-addressed, the same convention established since Phase-02) —
# not a static phase-name tag.
#
# Step E: dedicated ServiceAccount, not the implicit "default" SA every
# other service in this repo currently runs under (confirmed live — no
# existing platform/stubs/*/deployment.yaml sets serviceAccountName).
# Vault's Kubernetes auth method's entire security property is "the
# cluster vouches for this pod's identity" — binding a Vault role to the
# shared "default" SA would mean any pod in this namespace without its own
# override could authenticate as control-plane's Vault role, which
# defeats the point. scripts/vault-setup-control-plane.sh's own Vault role
# binds specifically to this ServiceAccount + namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: default
---
# Phase-05 Step M: RBAC for the in-process reconciler's own AnalysisRun
# access (internal/analysis/k8s_client.go) — list/get/watch to read
# status, create to start a new stage's check. Deliberately does NOT
# grant access to Rollout objects: this project's canary traffic-shifting
# is Step K's own etcd envelope, not Argo Rollouts' native Rollout
# resource, so control-plane never needs to touch one. No delete/update
# either — AnalysisRun objects this process creates are left for Argo
# Rollouts' own controller and Kubernetes' own garbage collection to
# manage, not mutated after creation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-analysisrun
  namespace: default
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["analysisruns"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-analysisrun
  namespace: default
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: default
roleRef:
  kind: Role
  name: control-plane-analysisrun
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: default
  labels:
    app: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: control-plane
      containers:
        - name: control-plane
          image: onezox/control-plane:234681c
          imagePullPolicy: IfNotPresent
          env:
            - name: COCKROACH_HOST
              value: onezox-crdb-public.default.svc.cluster.local
            - name: COCKROACH_PORT
              value: "26257"
            - name: COCKROACH_USER
              value: control_plane
            - name: VAULT_ADDR
              # vault-active, not the plain "vault" Service: routes
              # specifically to the current Raft leader rather than
              # load-balancing across all 3 pods (2 of which are standbys
              # that transparently forward anyway, but pinning to the
              # leader keeps this deterministic).
              value: http://vault-active.default.svc.cluster.local:8200
            - name: VAULT_K8S_ROLE
              value: control-plane
            - name: ETCD_ENDPOINTS
              value: http://etcd.default.svc.cluster.local:2379
            - name: PROMETHEUS_ADDR
              value: http://prometheus-server.default.svc.cluster.local
            - name: ANALYSIS_NAMESPACE
              value: default
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50051
              name: grpc
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: default
  labels:
    app: control-plane
spec:
  selector:
    app: control-plane
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: grpc, port: 50051, targetPort: 50051 }
