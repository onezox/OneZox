# Cilium mTLS enforcement between edge-gateway (Phase-01), provider-gateway
# (Phase-02), and data-plane (Phase-03, cut over from dataplane-stub at
# Step J — dataplane-stub-mtls, the reverse dataplane-stub->edge-gateway
# rule edge-gateway-mtls used to carry, and dataplane-stub's own identity
# in provider-gateway-mtls's ingress rule were all removed together in
# this same cleanup commit, once data-plane-mtls below was confirmed
# healthy).
#
# Completes the last Phase-00 acceptance item: SPIRE (Step 9) installed the
# mTLS *capability* only, deliberately not enforced at the time, pending
# real services to enforce it between. edge-stub-mtls (the third original
# Phase-00 policy) was removed in Phase-01 Step F3 once edge-gateway-mtls
# below was confirmed healthy — edge-stub itself was removed in the same
# cutover, replaced by edge-gateway. provider-stub-mtls was removed the
# same way in Phase-02 Step K3, once provider-gateway-mtls below was
# confirmed healthy — provider-stub itself removed in that same cutover,
# replaced by provider-gateway. dataplane-stub-mtls followed the same
# pattern in Phase-03 Step J, replaced by data-plane-mtls below.
#
# Design constraint that shaped every rule below: adding ANY ingress rule
# to a CiliumNetworkPolicy switches that endpoint's ingress to default-deny
# for everything NOT explicitly matched — but only for ingress; egress is
# untouched since no egress rules are defined here. Port 8080 on each
# service already serves two things besides sibling traffic:
#   1. kubelet's own liveness/readiness probes (Cilium identity: `host`)
#   2. Prometheus's /metrics scrape (Deployment Step 7 verification)
# Both get an explicit no-auth allow rule below so this doesn't regress
# either already-verified behavior. Nothing else is allowed in on 8080.

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: edge-gateway-mtls
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: edge-gateway
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The dataplane-stub -> edge-gateway reverse rule this policy used to
    # carry (Phase-00's original stub-to-stub mTLS capability proof, never
    # functionally used — nothing in the real architecture calls FROM the
    # data plane INTO edge-gateway) was removed in Step J's cleanup,
    # matching the same "one proven direction is sufficient" precedent
    # provider-gateway-mtls's own header comment already established when
    # Phase-02 Step K3 did not recreate the equivalent reverse rule for
    # provider-gateway.
---
# Phase-02 Step K3: provider-gateway's own mTLS ingress policy, added and
# verified healthy BEFORE provider-stub-mtls/provider-stub's Deployment
# are removed in a later, separate commit — no window where
# provider-gateway is deployed but has no mesh identity, same
# mesh-identity-safe sequencing Phase-01 Step F2 used for edge-gateway.
#
# No egress rules here (those are provider-gateway/egress-policy.yaml,
# Step J1) — this file is ingress-only by convention, matching the header
# comment above; Cilium enforces the two directions independently, so a
# separate CiliumNetworkPolicy object per direction is fine.
#
# data-plane -> provider-gateway (this rule): data-plane's own boot
# sequence calls ProviderHealth (Step A7) as a real, non-hypothetical
# connectivity proof, the same way it proves Cockroach and Redis, and its
# real Submit flow dispatches to provider-gateway's Invoke on every
# request. Port here is 50051 (provider-gateway's real gRPC port).
#
# Phase-03 Step B widened this rule to allow BOTH dataplane-stub and
# data-plane during the coexistence window (data-plane deployed
# preliminarily, dataplane-stub not yet cut over). Step J's cutover
# narrowed it back down to data-plane alone, once dataplane-stub itself
# was removed — matching how provider-stub-mtls's own removal at K3
# narrowed the equivalent rule on the other side, and how this same rule
# used to allow dataplane-stub calling provider-gateway (a pure mTLS
# capability proof, Phase-00's dataplane-stub<->provider-stub pairing)
# before data-plane's real traffic replaced it.
#
# The REVERSE direction the old stub pair also had (provider-stub calling
# INTO dataplane-stub on 8080) was deliberately NOT recreated for
# provider-gateway/data-plane at either cutover: that direction never had
# a functional purpose even for the stubs (pure capability proof), and
# inventing a new reverse relationship here would be adding scope neither
# Phase-02.txt nor Phase-03.txt calls for. One proven direction is
# sufficient to demonstrate the mTLS capability.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: provider-gateway-mtls
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: provider-gateway
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            # kubectl port-forward (used throughout Phase-02 for
            # host-based live verification, same as data-plane-mtls's
            # own justification) authenticates as "host", not as any
            # peer's own SPIRE identity.
            - port: "50051"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: data-plane
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
      authentication:
        mode: "required"
    # Phase-05 Step U1b: admin-api's own peer rule, added the same step
    # its ProviderHealth client dial first ships — the same "no window
    # where a real service is live without mesh identity" sequencing
    # every prior rule in this file used (Step E did exactly this for
    # admin-api -> control-plane).
    #
    # ProviderHealth ONLY — a read: breaker state and quota headroom for
    # the panel's Provider Console (Part R). admin-api never calls
    # Invoke/InvokeEmbedding; those are data-plane's own path, and
    # nothing in the admin surface should ever originate provider
    # traffic. That restriction is by construction in admin-api's own
    # narrow client interface (providerHealthReader, server.go), not
    # enforced here — L7 gRPC-method authorization isn't this project's
    # established pattern, the same note control-plane-mtls's own
    # admin-api rule already makes.
    - fromEndpoints:
        - matchLabels:
            app: admin-api
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
      authentication:
        mode: "required"
---
# Phase-03 Step J: data-plane's own mTLS ingress policy, added and
# confirmed healthy (SPIRE identity established, VALID:true) BEFORE
# dataplane-stub-mtls/dataplane-stub's Deployment were removed in this
# same cleanup — no window where the real data plane is live without
# mesh identity, same mesh-identity-safe sequencing Phase-01 Step F2 and
# Phase-02 Step K3 both used. Shape mirrors the old dataplane-stub-mtls
# exactly (host for kubelet probes + kubectl port-forward, prometheus for
# /metrics, edge-gateway's real Submit() gRPC calls with mTLS required).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: data-plane-mtls
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: data-plane
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "50051"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: edge-gateway
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
      authentication:
        mode: "required"
---
# Phase-04 Step D: control-plane's own mTLS ingress policy, added at the
# same step its Deployment first ships — same mesh-identity-safe sequencing
# every prior service used (edge-gateway Step F2, provider-gateway Step
# K3, data-plane Step J): no window where a real service is live without
# mesh identity. Host (kubelet probes + kubectl port-forward) and
# prometheus (metrics scrape) rules landed at Step D. Step K adds the
# first peer-to-peer rule: provider-gateway calling IssueProviderToken —
# added and confirmed healthy BEFORE Step M's dual-path credential code is
# deployed, same "prove the new mechanism reachable before anything
# depends on it" ordering as every mesh cutover so far. edge-gateway's own
# call to ListModels (Step S) adds its own fromEndpoints rule later, when
# THAT step reaches live traffic — matching how every other -mtls block in
# this file grew its peer rules incrementally rather than all at once.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: control-plane-mtls
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: control-plane
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "50051"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: provider-gateway
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
      authentication:
        mode: "required"
    # Phase-05 Step E: admin-api's own peer rule, added the same step its
    # gRPC client dial to control-plane first ships — same "no window
    # where a real service is live without mesh identity" sequencing as
    # every prior rule in this block (edge-gateway Step F2, provider-
    # gateway Step K3, data-plane Step J, admin-api's own predecessor
    # rules here at Step Q/S). CreateRollout/PromoteRollout/AbortRollout/
    # GetRolloutStatus/RegisterModelManifest all arrive over this same
    # port; no separate rule is needed per RPC — L7 authorization (which
    # RPCs a given caller may invoke) isn't this project's established
    # pattern, matching the note on provider-gateway's own IssueProviderToken
    # rule above.
    - fromEndpoints:
        - matchLabels:
            app: admin-api
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
      authentication:
        mode: "required"
---
# Phase-05 Step E: admin-api's own mTLS ingress policy, added the same
# step its Deployment first ships — same mesh-identity-safe sequencing
# every prior service used. Host (kubelet probes) and prometheus (metrics
# scrape) rules land now; admin-panel's own fromEndpoints rule is added at
# Step V, when THAT service first reaches live traffic — the same
# incremental-peer-rule-growth pattern control-plane-mtls's own header
# documents.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: admin-api-mtls
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: admin-api
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "50051"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
