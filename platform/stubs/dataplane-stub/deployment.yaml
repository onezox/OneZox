# Phase-00 throwaway health stub (Python), extended in Phase-01 with a
# minimal DataplaneService.Submit gRPC shim (port 50051) so edge-gateway has
# a real downstream to call. Replaced by the real data plane in Phase-03.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataplane-stub
  namespace: default
  labels:
    app: dataplane-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataplane-stub
  template:
    metadata:
      labels:
        app: dataplane-stub
    spec:
      containers:
        - name: dataplane-stub
          image: onezox/dataplane-stub:phase01
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50051
              name: grpc
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dataplane-stub
  namespace: default
  labels:
    app: dataplane-stub
spec:
  selector:
    app: dataplane-stub
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
