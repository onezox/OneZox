# Phase-02: the real provider-gateway (Go), replacing the Phase-00
# provider-stub. Originally brought forward as a PRELIMINARY deployment
# (Redis Cluster's multi-shard topology makes host-side port-forward
# testing unreliable for a cluster-aware client following MOVED redirects
# to pod IPs the host can't reach, so a real in-cluster deployment was the
# only reliable way to live-verify quota/breaker/coalescing as they were
# built). Cutover from provider-stub completed in Step K3 — provider-stub
# and all its resources (Deployment, Service, mTLS policy) are gone.
#
# Step J3: provider-gateway-credentials mounted here, via envFrom so all
# three key fields (OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_API_KEY)
# become container env vars without enumerating each one — the ONLY
# workload this Secret is referenced from anywhere in this repo (verified
# live, not just by manifest inspection: no other pod's spec references
# it). Mounted only after Step J1-J2's egress default-deny + allow-list
# was built AND verified in both directions (an approved host reachable,
# an arbitrary unapproved one refused) — a mounted key in a pod that can
# reach arbitrary hosts is exfiltratable; the Secret existing was never
# the risk, egress being open would have been.
#
# Image tag is the git commit short-SHA this image was built from
# (content-addressed, not a static "phase02" string) — a rebuild changes
# the tag, so a normal git commit + Argo sync rolls it out with no manual
# `kubectl rollout restart` workaround.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-gateway
  namespace: default
  labels:
    app: provider-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provider-gateway
  template:
    metadata:
      labels:
        app: provider-gateway
    spec:
      containers:
        - name: provider-gateway
          image: onezox/provider-gateway:b9152ded57e8
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: provider-gateway-credentials
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50051
              name: grpc
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: provider-gateway
  namespace: default
  labels:
    app: provider-gateway
spec:
  selector:
    app: provider-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
