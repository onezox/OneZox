# Phase-02: the real provider-gateway (Go), replacing the Phase-00
# provider-stub. Originally brought forward as a PRELIMINARY deployment
# (Redis Cluster's multi-shard topology makes host-side port-forward
# testing unreliable for a cluster-aware client following MOVED redirects
# to pod IPs the host can't reach, so a real in-cluster deployment was the
# only reliable way to live-verify quota/breaker/coalescing as they were
# built). Cutover from provider-stub completed in Step K3 — provider-stub
# and all its resources (Deployment, Service, mTLS policy) are gone.
#
# Step J3 (Phase-02) originally mounted provider-gateway-credentials here
# via envFrom. Phase-04 Step P REMOVED it — the F9 credential cutover is
# complete. Sequence, in full:
#   Step M: dual-path code deployed (Vault-first, this Secret as fallback).
#   Step N: positively confirmed via Vault's own audit log (not just this
#     app's self-report) that every pod was genuinely reading from Vault —
#     correct control-plane K8s-auth identity/policies on the actual token
#     used, zero fallback firings.
#   Step O: fallback code removed entirely — Vault-only from here on.
#   Step P (this deploy): with envFrom still mounted, the Secret's VALUES
#     were poisoned with garbage strings, pods restarted so the poisoned
#     values genuinely landed in the container env (confirmed by length,
#     never printed), and a REAL Invoke call through provider-gateway to
#     openai still succeeded — a genuine streamed completion with real
#     token usage, which is impossible if the poisoned Secret value had
#     been used (OpenAI would return 401). That's what proves this isn't
#     merely unused, it's genuinely dead: envFrom is removed and the
#     Secret itself is deleted in this same commit.
# This closes the base64-Secret credential-exposure class the between-phase
# provider task first surfaced — permanently, not just for the 5 providers
# active as of this phase.
#
# Image tag is the git commit short-SHA this image was built from
# (content-addressed, not a static "phase02" string) — a rebuild changes
# the tag, so a normal git commit + Argo sync rolls it out with no manual
# `kubectl rollout restart` workaround.
#
# Step M1: replicas bumped 1 -> 3 (kept at 3) specifically to prove the
# quota governor is FLEET-WIDE (shared Redis counter,
# provider:{name}:quota:{window}) and not per-pod — a per-pod cap is
# indistinguishable from a fleet-wide one in a single-replica test. 60
# concurrent distinct requests split evenly across all 3 pods' own
# port-forwards produced exactly 30 allowed / 30 fallback (the configured
# cap, not 3x it), confirmed against Redis directly: exactly ONE key for
# the window, value 60 — every pod incremented the same counter. Full
# result in Phase-02-Progress.txt. The QUOTA_LIMIT_PER_MINUTE=30 override
# used during that test has been reverted below — it was a test-only
# convenience value with no real-world basis, not a tuned setting.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-gateway
  namespace: default
  labels:
    app: provider-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: provider-gateway
  template:
    metadata:
      labels:
        app: provider-gateway
    spec:
      containers:
        - name: provider-gateway
          image: onezox/provider-gateway:58a401a
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50051
              name: grpc
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: provider-gateway
  namespace: default
  labels:
    app: provider-gateway
spec:
  selector:
    app: provider-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
