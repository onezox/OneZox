# Phase-01 edge-gateway (Rust) — real public ingress, replacing the
# Phase-00 edge-stub. Deployed ALONGSIDE edge-stub during the cutover
# (Step F2): edge-stub's own Deployment/Service/CiliumNetworkPolicy are
# removed in a separate, later commit (Step F3), only once this one is
# confirmed Synced/Healthy with edge-gateway-mtls (platform/stubs/mtls/
# ciliumnetworkpolicy.yaml) in place — no gap where edge-gateway lacks a
# mesh identity. Deployed via the onezox-stubs Argo CD Application, not
# kubectl.
#
# Phase-04 Step R: edge-gateway's first real etcd-watch integration — an
# etcd-fed model_registry cache with its own independent Vault Transit
# verification (mirroring data-plane's own Step Q). Dedicated
# ServiceAccount added (edge-gateway had none before — ran under the
# implicit "default" SA) because Vault's Kubernetes auth role
# (scripts/vault-setup-edge-gateway.sh) binds specifically to it. No new
# CiliumNetworkPolicy egress rule needed: edge-gateway has never had an
# egress allow-list at all (deliberately deferred, matching data-plane's
# own still-open egress posture as of Step Q) — its egress stays
# unrestricted, so etcd/Vault reachability needs no new Cilium config.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-gateway
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: default
  labels:
    app: edge-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
    spec:
      serviceAccountName: edge-gateway
      containers:
        - name: edge-gateway
          image: onezox/edge-gateway:ccf83a5
          imagePullPolicy: IfNotPresent
          env:
            - name: ETCD_ENDPOINT
              value: "etcd.default.svc.cluster.local:2379"
            - name: VAULT_ADDR
              value: "http://vault-active.default.svc.cluster.local:8200"
            - name: VAULT_K8S_ROLE
              value: "edge-gateway"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
  namespace: default
  labels:
    app: edge-gateway
spec:
  selector:
    app: edge-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
