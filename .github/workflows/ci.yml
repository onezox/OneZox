name: CI

# Runs on every push and every pull request, against any branch — no path
# or branch filters, per the Phase-00 CI requirement to always run.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BUF_VERSION: "1.72.0"
  SYFT_VERSION: "1.49.0"
  COSIGN_VERSION: "3.1.2"

jobs:
  # Gate 1: proto contract checks (Part C). Must pass before anything is
  # built — a broken or breaking contract should never reach a build step.
  proto:
    name: buf lint & breaking-change check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install buf ${{ env.BUF_VERSION }}
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf
          buf --version

      - name: buf lint (proto/)
        working-directory: proto
        run: buf lint

      - name: Determine breaking-change base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            # First push to a new branch/repo: nothing to compare against yet.
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: buf breaking (proto/, against ${{ steps.base.outputs.ref }})
        if: steps.base.outputs.skip != 'true'
        working-directory: proto
        run: |
          buf breaking --against "https://github.com/${{ github.repository }}.git#ref=${{ steps.base.outputs.ref }},subdir=proto"

  # Gate 2: the test suites. Added by post-M2 audit fix C4 — until then CI
  # ran ZERO tests: its only two jobs were the proto gate and build-sign, so
  # every test in the repo ran by hand or not at all, and a regression in the
  # RBAC allow-list, the rollout state machine or the audit fail-loud path
  # would have gone straight through a green pipeline.
  #
  # One job per language rather than a matrix: setup differs substantially
  # (Go toolchain vs. Rust + protoc vs. Python venv vs. npm), and separate
  # jobs mean one language's failure doesn't hide another's — the same
  # reasoning build-sign's own fail-fast:false already applies.
  #
  # EVERY job below asserts a MINIMUM TEST COUNT and fails if it is not met.
  # That guard is the point, not decoration: the failure this project keeps
  # hitting is not a test that breaks loudly, it is a step that silently
  # matches zero test files (a wrong working directory, a moved path, a bad
  # filter) and exits 0. `go test ./...` on a package with no tests exits 0.
  # `pytest` collecting nothing exits 5 but is easy to swallow. A green tick
  # that proves nothing is worse than a red one. Floors are set below current
  # counts so ordinary churn does not trip them, but far enough above zero
  # that a collapse cannot pass.
  test-go:
    name: Tests — Go (provider-gateway, control-plane, admin-api, provider-fake)
    needs: proto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Sourced from go.work so the toolchain can never drift from what
          # the workspace itself declares.
          go-version-file: go.work

      - name: go vet
        run: |
          for m in provider-gateway control-plane admin-api provider-fake; do
            echo "::group::go vet $m"
            (cd "services/$m" && go vet ./...)
            echo "::endgroup::"
          done

      - name: go test
        run: |
          set -euo pipefail
          total=0
          # provider-fake is deliberately absent from the floor check: it is a
          # test-only HTTP stand-in with no test files of its own. It is still
          # vetted and compiled above, so a break in it still fails this job.
          declare -A FLOOR=( [provider-gateway]=50 [control-plane]=40 [admin-api]=44 )
          for m in provider-gateway control-plane admin-api provider-fake; do
            echo "::group::go test $m"
            (cd "services/$m" && go test ./... -v 2>&1 | tee "/tmp/$m.log") || exit 1
            n=$(grep -c '^--- PASS' "/tmp/$m.log" || true)
            echo "$m: $n tests passed"
            echo "::endgroup::"
            floor=${FLOOR[$m]:-0}
            if [ "$n" -lt "$floor" ]; then
              echo "::error::$m ran $n tests, expected at least $floor — a suite that silently matches zero tests must fail, not pass"
              exit 1
            fi
            total=$((total + n))
          done
          echo "Go tests passed: $total"

  test-rust:
    name: Tests — Rust (edge-gateway)
    needs: proto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # edge-gateway's build.rs compiles proto/ via prost, exactly as its own
      # Dockerfile does — without protoc the build fails before any test runs.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: cargo test
        run: |
          set -euo pipefail
          cargo test --manifest-path services/edge-gateway/Cargo.toml 2>&1 | tee /tmp/rust.log
          n=$(grep -oE '^test result: ok\. [0-9]+ passed' /tmp/rust.log | awk '{s+=$4} END {print s+0}')
          echo "Rust tests passed: $n"
          if [ "$n" -lt 55 ]; then
            echo "::error::edge-gateway ran $n tests, expected at least 55"
            exit 1
          fi

  test-python:
    name: Tests — Python (data-plane)
    needs: proto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Matches [tool.ruff] target-version / [tool.mypy] python_version
          # in the workspace pyproject.toml.
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/data-plane/requirements.txt
          # pytest and ruff live in the workspace pyproject's dev dependency
          # group, not in the service's runtime requirements.txt — pinned
          # here to the same versions that file declares.
          pip install "pytest==9.1.1" "ruff==0.16.0"

      - name: ruff
        working-directory: services/data-plane
        run: ruff check . --exclude generated

      - name: pytest
        working-directory: services/data-plane
        run: |
          set -euo pipefail
          pytest . -q 2>&1 | tee /tmp/py.log
          n=$(grep -oE '[0-9]+ passed' /tmp/py.log | head -1 | awk '{print $1}')
          n=${n:-0}
          echo "Python tests passed: $n"
          if [ "$n" -lt 55 ]; then
            echo "::error::data-plane ran $n tests, expected at least 55"
            exit 1
          fi

  test-typescript:
    name: Typecheck — TypeScript (admin-panel)
    needs: proto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Matches admin-panel's own Dockerfile base image.
          node-version: "24"

      - name: Install dependencies
        working-directory: admin-panel
        run: npm ci

      # admin-panel has no unit-test suite yet — this is a TYPECHECK, and is
      # labelled as one rather than dressed up as tests. It still catches the
      # class of break that matters most here: a resolver or Server Action
      # whose types stop matching the GraphQL/proto contract. The guard below
      # is correspondingly different in kind: it asserts tsc actually had
      # source files to check, so a wrong working directory cannot pass as a
      # clean typecheck.
      - name: tsc --noEmit
        working-directory: admin-panel
        run: |
          set -euo pipefail
          n=$(find app components lib -name '*.ts' -o -name '*.tsx' | wc -l)
          echo "TypeScript source files: $n"
          if [ "$n" -lt 20 ]; then
            echo "::error::found only $n TS sources, expected at least 20 — typecheck would be vacuous"
            exit 1
          fi
          npx tsc --noEmit

  # Gate 3: build every stub service image, generate its SBOM, and sign it.
  # Each service builds and is verified independently (fail-fast disabled)
  # so one language's failure doesn't hide the other two's results.
  #
  # Gated behind every test job (audit fix C4): nothing is built, SBOM'd or
  # signed until the suites that back M2's exit criteria have passed.
  build-sign:
    name: Build, SBOM & sign — ${{ matrix.service }}
    needs: [proto, test-go, test-rust, test-python, test-typescript]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Explicit per-service dockerfile AND context (post-M2 audit fixes
      # H3 + H4). The old form assumed both could be derived from the
      # service name — `-f services/$s/Dockerfile services/$s` — which is
      # wrong for two of the six:
      #   edge-gateway builds from the REPO ROOT, because this is a Cargo
      #     workspace and Cargo.lock lives there. Building from the service
      #     directory is what let the old `COPY Cargo.lock*` glob match
      #     nothing and produce unreproducible images (H4).
      #   admin-panel does not live under services/ at all — the phase file
      #     and the architecture both place it at the repo root.
      #
      # H3: admin-api and admin-panel added. Until now the two services
      # holding the admin credential surface and the operator console were
      # the only ones with no CI build, no SBOM and no signature, while
      # four older services had all three.
      #
      # provider-fake is deliberately EXCLUDED. It is a test-only,
      # zero-dependency HTTP stand-in used to make providers fail on
      # demand; it never runs outside test scenarios, so an SBOM and a
      # sigstore signature for it would assert a supply-chain guarantee
      # about something that is not part of the product. It is still
      # compiled and vetted by the test-go job, so a break in it fails CI.
      matrix:
        include:
          - service: edge-gateway
            dockerfile: services/edge-gateway/Dockerfile
            context: .
          - service: data-plane
            dockerfile: services/data-plane/Dockerfile
            context: services/data-plane
          - service: provider-gateway
            dockerfile: services/provider-gateway/Dockerfile
            context: services/provider-gateway
          - service: control-plane
            dockerfile: services/control-plane/Dockerfile
            context: services/control-plane
          - service: admin-api
            dockerfile: services/admin-api/Dockerfile
            context: services/admin-api
          - service: admin-panel
            dockerfile: admin-panel/Dockerfile
            context: admin-panel
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # --provenance=false --sbom=false: BuildKit attaches its own OCI
      # attestation manifests by default, turning the output into a
      # manifest list instead of a plain single image manifest. That
      # exact manifest-list shape is what broke `kind load docker-image`
      # for these same images during local deployment (Phase-00
      # Deployment Step 7, worked around there with a manual `ctr images
      # import`). Disabling it here keeps every image a plain manifest,
      # consistent with how these images were built for the cluster.
      - name: Build ${{ matrix.service }} image
        run: |
          docker build --provenance=false --sbom=false \
            -t "onezox/${{ matrix.service }}:${{ github.sha }}" \
            -f "${{ matrix.dockerfile }}" \
            "${{ matrix.context }}"

      - name: Install Syft ${{ env.SYFT_VERSION }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin "v${SYFT_VERSION}"
          syft version

      - name: Generate SPDX SBOM
        run: |
          mkdir -p sbom-out
          syft "onezox/${{ matrix.service }}:${{ github.sha }}" \
            -o "spdx-json=sbom-out/${{ matrix.service }}.spdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-out/${{ matrix.service }}.spdx.json
          retention-days: 30

      # Cosign signs registry-addressable images (the signature is pushed
      # as a separate OCI artifact next to the image) — the same reason a
      # temporary local registry was used to prove signing worked in
      # Phase-00 Step 24. Using one here too keeps this pipeline
      # self-contained: no image is published anywhere outside this job.
      - name: Start ephemeral local registry
        run: docker run -d --name registry -p 5000:5000 registry:2

      - name: Push image to ephemeral registry
        id: push
        run: |
          docker tag "onezox/${{ matrix.service }}:${{ github.sha }}" \
            "localhost:5000/onezox/${{ matrix.service }}:${{ github.sha }}"
          digest=$(docker push "localhost:5000/onezox/${{ matrix.service }}:${{ github.sha }}" \
            | tee /dev/stderr | grep -oE 'sha256:[a-f0-9]{64}' | tail -1)
          echo "image_ref=localhost:5000/onezox/${{ matrix.service }}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign ${{ env.COSIGN_VERSION }}
        run: |
          curl -sSL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          cosign version

      # Uses the existing dev key pair (COSIGN_KEY / COSIGN_PASSWORD repo
      # secrets, sourced from the already-generated .tooling/cosign/
      # key pair — never committed) and the existing no-Rekor signing
      # config already tracked at .tooling/cosign/signing_config_no_tlog.json,
      # preserving the Step 24 decision not to upload dev signatures to the
      # public Rekor transparency log.
      - name: Sign image with cosign
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          umask 077
          printf '%s' "${{ secrets.COSIGN_KEY }}" > cosign.key
          cosign sign --key cosign.key \
            --allow-insecure-registry \
            --signing-config .tooling/cosign/signing_config_no_tlog.json \
            --yes \
            "${{ steps.push.outputs.image_ref }}"
          rm -f cosign.key

      - name: Verify signature against tracked public key
        run: |
          cosign verify --key platform/security/cosign/cosign.pub \
            --allow-insecure-registry \
            --insecure-ignore-tlog=true \
            "${{ steps.push.outputs.image_ref }}"

      - name: Stop ephemeral registry
        if: always()
        run: docker rm -f registry
