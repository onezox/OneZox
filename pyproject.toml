# Workspace-level tool configuration shared by every Python service in this
# monorepo (Part C: data-plane, memory-service, eval-platform). No [project]
# table on purpose — this is not an installable package, just shared lint /
# type-check / test standards. Application code, and each service's own
# pyproject.toml, are out of scope until the phase step that builds them.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
minversion = "9.0"

[dependency-groups]
dev = [
    "ruff==0.16.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
]
