[package]
name = "edge-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["clock"] }
jsonwebtoken = "9"
async-trait = "0.1"
redis = { version = "1.4", features = ["tokio-comp", "cluster-async"] }
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
tracing-opentelemetry = "0.33"
async-stream = "0.3"
futures-util = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Not a build-dependency: proto codegen no longer runs at build time (see
# src/pb.rs's doc comment) — only used by the #[ignore]-gated regeneration
# test, a manual dev-time operation.
tonic-prost-build = "0.14"
