syntax = "proto3";

package control.v1;

option go_package = "github.com/onezox/OneZox/services/control-plane/internal/pb/control/v1;controlv1";

// Phase-04's control-plane contract (Architecture Part B, Part G.2).
// Four RPCs, matching Phase-04.txt's own APIS CREATED section exactly:
// RegisterModelManifest/GetModelManifest/ListModels are registry/-owned
// (Step E); IssueProviderToken is Vault-backed and gateway-only (Step J).
// This proto is defined in full now (Step D, control-plane's skeleton) so
// the gRPC service can register — each RPC's actual handler logic lands in
// its own later, separately-committed step; until then the server embeds
// UnimplementedControlServiceServer and every method here returns
// codes.Unimplemented, the same "defined here, wired when consumed"
// pattern provider-gateway's own ProviderHealth used in Phase-02.
//
// Phase-05 Step D adds four rollout/-owned RPCs (Step L implements them).
// Deliberately only the HUMAN-TRIGGERED half of the rollout state machine
// is exposed here: CreateRollout starts one, PromoteRollout/AbortRollout
// are manual overrides (Architecture Part R's "live promote/rollback
// controls"), GetRolloutStatus reads one. The AUTOMATIC timer- and
// AnalysisRun-driven advance/rollback logic is NOT an RPC at all — it
// lives entirely inside control-plane's own process (a background
// goroutine watching Argo Rollouts' Rollout/AnalysisRun CRDs via
// client-go, Step M), so it is unreachable over the network by
// construction, not merely rejected by a parameter check. None of the
// four new RPCs below accepts a target stage or a canary percentage —
// PromoteRollout always advances exactly one staged step, the same rule
// the internal automatic advance follows; there is no field or code path
// anywhere in this service that sets a live traffic percentage directly.
// This is the EC4 "no path exists to mutate a live model outside signed
// manifests + rollout" guarantee, enforced by this contract's own shape.

service ControlService {
  rpc RegisterModelManifest(RegisterModelManifestRequest) returns (RegisterModelManifestResponse);
  rpc GetModelManifest(GetModelManifestRequest) returns (GetModelManifestResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc IssueProviderToken(IssueProviderTokenRequest) returns (IssueProviderTokenResponse);
  rpc CreateRollout(CreateRolloutRequest) returns (CreateRolloutResponse);
  rpc PromoteRollout(PromoteRolloutRequest) returns (PromoteRolloutResponse);
  rpc AbortRollout(AbortRolloutRequest) returns (AbortRolloutResponse);
  rpc GetRolloutStatus(GetRolloutStatusRequest) returns (GetRolloutStatusResponse);
  rpc ListRollouts(ListRolloutsRequest) returns (ListRolloutsResponse);
}

// spec_json carries the manifest body as a JSON-encoded string (mirrors
// model_manifest.spec_json's JSONB column, 0008_create_model_manifest.sql)
// rather than a typed message — Phase-04.txt doesn't pin down the model
// spec's own shape, and a typed proto message would force a guess at that
// shape this phase isn't chartered to make.
message RegisterModelManifestRequest {
  string model_ref = 1;
  string spec_json = 2;
  string created_by = 3;
}

message RegisterModelManifestResponse {
  string version_id = 1;
}

// version_id empty means "the currently active version" (resolved via
// model_active, 0009_create_model_active.sql) rather than a specific one.
message GetModelManifestRequest {
  string model_ref = 1;
  string version_id = 2;
}

message GetModelManifestResponse {
  string version_id = 1;
  string model_ref = 2;
  string spec_json = 3;
  string signature = 4;
  string created_by = 5;
  string created_at = 6;
  string status = 7;
}

message ListModelsRequest {}

message ListModelsResponse {
  message Entry {
    string model_ref = 1;
    string active_version_id = 2;
  }
  repeated Entry models = 1;
}

// provider/scope select which Vault-issued credential is returned — the
// exact scoping shape (per-provider policy path, TTL) is Step J's own
// design, not fixed here beyond the request/response envelope.
message IssueProviderTokenRequest {
  string provider = 1;
  string scope = 2;
}

message IssueProviderTokenResponse {
  string token = 1;
  int64 ttl_seconds = 2;
}

// strategy_json is opaque here too (mirrors RegisterModelManifestRequest's
// own spec_json reasoning) — it configures the Argo Rollouts Rollout
// resource's step list (Step M), not a field this RPC's own contract
// needs to understand. Deliberately no target-stage or percent field
// anywhere on this message: a rollout always starts at its first step.
message CreateRolloutRequest {
  string model_ref = 1;
  string version_id = 2;
  string strategy_json = 3;
}

message CreateRolloutResponse {
  string rollout_id = 1;
}

// No target-stage field — advances exactly one staged step from wherever
// the rollout currently is. Same rule the internal automatic advance
// (control-plane's own Rollout-CRD watch loop, Step M) follows; this RPC
// only lets a human trigger that same one-step transition early instead
// of waiting out the current pause.
message PromoteRolloutRequest {
  string rollout_id = 1;
}

message PromoteRolloutResponse {
  string new_stage = 1;
}

message AbortRolloutRequest {
  string rollout_id = 1;
}

message AbortRolloutResponse {}

message GetRolloutStatusRequest {
  // Either identifies the rollout directly, or — if rollout_id is empty —
  // resolves model_ref's current/most recent rollout.
  string rollout_id = 1;
  string model_ref = 2;
}

message GetRolloutStatusResponse {
  string rollout_id = 1;
  string model_ref = 2;
  string version_id = 3;
  string stage = 4;
  string status = 5;
  int32 canary_percent = 6;
  string started_at = 7;
  string ended_at = 8;
}

// ListRollouts — Phase-05 Step U1a. A READ, the plural companion to
// GetRolloutStatus above (same query half of this file's own
// commands-vs-queries split); adds NO mutation surface, so EC4's
// "no bypass verb exists" property is untouched.
//
// Exists because admin-api genuinely CANNOT read the rollout table
// itself: migration 0020 revoked its SELECT/INSERT/UPDATE grants there
// deliberately, so control_plane is the table's only DB-level reader
// (proven adversarially at Step T). The panel's rollout history view and
// getDashboardMetrics()'s own active-rollout count both need that data,
// and routing them through this RPC keeps the DB boundary intact rather
// than re-granting admin_api the access Step T just proved it lacks.
message ListRolloutsRequest {
  // Empty model_ref lists every rollout; set it to scope to one model.
  string model_ref = 1;
  // 0 means "this service's own default" (50) rather than unbounded —
  // a panel list view never needs the full table, and an unbounded
  // default would make an accidental full scan the easy path.
  int32 limit = 2;
}

message ListRolloutsResponse {
  // Most recent first (started_at DESC).
  repeated GetRolloutStatusResponse rollouts = 1;
}
