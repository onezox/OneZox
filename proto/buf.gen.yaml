version: v2

inputs:
  - directory: .

# Message codegen for all three OneZox languages (Part C), plus gRPC
# service-stub codegen for Rust and Python — the two languages that consume
# dataplane.v1.DataplaneService (Phase-01: edge-gateway, dataplane-stub). No
# Go grpc plugin added: no Go service in this phase calls this contract
# (provider-stub doesn't touch it; Go's real consumer, the Provider Gateway,
# is Phase-02). protocolbuffers/go (message-only) is unchanged from Phase-00.
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
  - remote: buf.build/protocolbuffers/python
    out: gen/python
  - remote: buf.build/grpc/python
    out: gen/python
  - remote: buf.build/community/neoeinstein-prost
    out: gen/rust
  - remote: buf.build/community/neoeinstein-tonic
    out: gen/rust
